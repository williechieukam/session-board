<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale: browser zoom is a low-vision fallback. The board blocks its own
         pinch gesture with touch-action: none, which is where that actually matters. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#edf1f3" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#13191d" />
    <title>Sessionboard</title>
    <meta name="description" content="A sticky-note board for running a workshop from one screen." />

    <!--
      Share card. og:image is relative because this app has no canonical origin yet; most
      platforms need it absolute, so it becomes https://<host>/og-image.png on the day there
      is a host, alongside the canonical link that is deliberately absent for the same reason.
    -->
    <meta property="og:title" content="Sessionboard" />
    <meta property="og:description" content="A sticky-note board for running a workshop from one screen." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Sessionboard",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Any (web browser)",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "description": "A sticky-note board for running a workshop from one screen."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Sessionboard is a sticky-note board for running a workshop from one screen. It needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
